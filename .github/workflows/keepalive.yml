# 무료 Supabase는 7일 동안 접속이 없으면 서버를 멈춤 → 사흘마다 한 번 가볍게 깨워 둠
# 주소와 공개 키는 js/config.js 에서 읽음 (공개 키라 비밀 설정 필요 없음)
name: Supabase 깨우기
on:
  schedule:
    - cron: "17 3 */3 * *"   # 사흘마다 (한국 시간 낮 12시 17분)
  workflow_dispatch: {}       # Actions 탭에서 직접 실행도 가능
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: js/config.js, sparse-checkout-cone-mode: false }
      - name: 데이터베이스에 한 번 묻기
        run: |
          URL=$(grep -o 'SUPABASE_URL: *"[^"]*"' js/config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -o 'SUPABASE_ANON_KEY: *"[^"]*"' js/config.js | sed 's/.*"\(.*\)"/\1/')
          code=$(curl -s -o out.json -w '%{http_code}' "$URL/rest/v1/characters?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "응답 $code"; head -c 200 out.json; echo
          test "$code" = "200"
